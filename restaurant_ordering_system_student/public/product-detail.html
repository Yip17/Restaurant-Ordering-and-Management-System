<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Restaurant Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3" id="nav-username">Welcome</span>
        <a href="/orders/my-orders"     class="nav-link text-white me-2">My Orders</a>
        <a href="/feedback/my-feedback" class="nav-link text-white me-2">My Feedback</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4">

    <div class="mb-3 d-flex gap-2 flex-wrap">
      <a href="/member/products" class="btn btn-outline-secondary btn-sm">← Back to Menu</a>
    </div>

    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading…</span>
      </div>
    </div>

    <div id="error-message" class="alert alert-danger" style="display:none;">
      Failed to load product details.
    </div>

    <div id="product-detail" style="display:none;">

      <!-- Product Info Card -->
      <div class="card mb-4">
        <div class="card-body">
          <h4 class="card-title mb-3" id="detail-name"></h4>
          <table class="table table-striped align-middle">
            <tbody>
              <tr><th style="width:180px;">Category</th><td id="detail-category"></td></tr>
              <tr><th>Description</th><td id="detail-description"></td></tr>
              <tr><th>Price</th><td id="detail-price"></td></tr>
              <tr><th>Status</th><td id="detail-status"></td></tr>
              <tr><th>Added</th><td id="detail-created-at"></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Place Order Card -->
      <div class="card mb-4" id="order-card">
        <div class="card-body">
          <h5 class="card-title">Place an Order</h5>

          <div id="order-success" class="alert alert-success" style="display:none;"></div>
          <div id="order-error"   class="alert alert-danger"  style="display:none;"></div>

          <form id="order-form">
            <div class="row g-3">
              <div class="col-md-2">
                <label for="quantity" class="form-label">Quantity</label>
                <input type="number" class="form-control" id="quantity"
                       value="1" min="1" max="99" required>
              </div>
              <div class="col-md-7">
                <label for="delivery-address" class="form-label">Delivery Address</label>
                <input type="text" class="form-control" id="delivery-address"
                       placeholder="e.g. 123 Main Street, Singapore 123456" required>
              </div>
              <div class="col-md-3 d-flex align-items-end">
                <button type="submit" id="order-btn" class="btn btn-success w-100">
                  Order Now
                </button>
              </div>
            </div>
          </form>

        </div>
      </div>

      <!-- ── Feedback Section ──────────────────────────────────────────── -->
      <div class="card mb-4" id="feedback-section">
        <div class="card-body">

          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title mb-0">Customer Feedback</h5>
            <!-- Write Feedback button — shown only when member is eligible -->
            <a id="write-feedback-btn" href="#" class="btn btn-primary btn-sm"
               style="display:none;">Write Feedback</a>
          </div>

          <div id="feedback-loading" class="text-center py-3">
            <div class="spinner-border spinner-border-sm text-secondary" role="status">
              <span class="visually-hidden">Loading…</span>
            </div>
          </div>

          <div id="feedback-error" class="alert alert-danger" style="display:none;"></div>

          <div id="no-feedback" class="alert alert-info mb-0" style="display:none;">
            No feedback yet for this product. Be the first to review!
          </div>

          <div id="feedback-list"></div>

        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  // ── State ─────────────────────────────────────────────────────────────────
  let currentProductId = null;
  let currentUserId    = null;

  // ── Boot ──────────────────────────────────────────────────────────────────
  document.addEventListener('DOMContentLoaded', async () => {
    // Resolve logged-in user once; reused by feedback/response rendering
    try {
      const r = await fetch('/api/auth/status');
      const d = await r.json();
      if (d.authenticated) {
        currentUserId = d.user.id;
        document.getElementById('nav-username').textContent = `Welcome, ${d.user.name}`;
      }
    } catch (_) {}

    await fetchProductDetail();
  });

  // ── Product detail ────────────────────────────────────────────────────────
  async function fetchProductDetail() {
    const params    = new URLSearchParams(window.location.search);
    currentProductId = params.get('id');
    const loading   = document.getElementById('loading');
    const errEl     = document.getElementById('error-message');
    const detail    = document.getElementById('product-detail');

    if (!currentProductId) {
      loading.style.display = 'none';
      errEl.style.display   = 'block';
      errEl.textContent     = 'No product specified.';
      return;
    }

    try {
      const res  = await fetch(`/products/${currentProductId}`);
      const data = await res.json();
      loading.style.display = 'none';

      if (!data.success || !data.product) {
        errEl.style.display = 'block';
        return;
      }

      const p = data.product;
      document.title = `${p.name} - Restaurant`;
      document.getElementById('detail-name').textContent        = p.name;
      document.getElementById('detail-category').textContent    = p.category    || '—';
      document.getElementById('detail-description').textContent = p.description || '—';
      document.getElementById('detail-price').textContent       = `$${parseFloat(p.price).toFixed(2)}`;
      document.getElementById('detail-created-at').textContent  = new Date(p.created_at).toLocaleDateString();
      document.getElementById('detail-status').innerHTML = `
        <span class="badge ${p.is_available ? 'bg-success' : 'bg-secondary'}">
          ${p.is_available ? 'Available' : 'Unavailable'}
        </span>`;

      if (!p.is_available) {
        document.getElementById('order-card').style.display = 'none';
      }

      detail.style.display = 'block';

      // Wire order form
      document.getElementById('order-form').addEventListener('submit', handleOrderSubmit);

      // Load feedback section in parallel
      await loadFeedbackSection();

    } catch (err) {
      console.error(err);
      loading.style.display = 'none';
      errEl.style.display   = 'block';
    }
  }

  // ── Order form ────────────────────────────────────────────────────────────
  async function handleOrderSubmit(e) {
    e.preventDefault();
    const successEl = document.getElementById('order-success');
    const errorEl   = document.getElementById('order-error');
    const btn       = document.getElementById('order-btn');

    successEl.style.display = 'none';
    errorEl.style.display   = 'none';
    btn.disabled    = true;
    btn.textContent = 'Placing order…';

    try {
      const res  = await fetch('/orders', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          product_id:       currentProductId,
          quantity:         parseInt(document.getElementById('quantity').value),
          delivery_address: document.getElementById('delivery-address').value.trim()
        })
      });
      const data = await res.json();

      if (data.success) {
        successEl.innerHTML = `Order placed! Status: <strong>PACKING</strong>.
          <a href="/orders/my-orders" class="alert-link ms-2">View My Orders →</a>`;
        successEl.style.display = 'block';
        document.getElementById('order-form').reset();
        // Re-check eligibility — completing an order may unlock Write Feedback
        checkWriteFeedbackEligibility();
      } else {
        errorEl.textContent   = data.message || 'Failed to place order.';
        errorEl.style.display = 'block';
      }
    } catch (_) {
      errorEl.textContent   = 'An error occurred.';
      errorEl.style.display = 'block';
    }

    btn.disabled    = false;
    btn.textContent = 'Order Now';
  }

  // ── Feedback section ──────────────────────────────────────────────────────
  async function loadFeedbackSection() {
    await Promise.all([
      checkWriteFeedbackEligibility(),
      loadFeedbackList()
    ]);
  }

  // Show "Write Feedback" button only when the member has a completed order
  // for this product and has not yet reviewed it.
  // Access control rule: eligibility check via /feedback/:productId/eligibility
  async function checkWriteFeedbackEligibility() {
    try {
      const res  = await fetch(`/feedback/${currentProductId}/eligibility`);
      const data = await res.json();
      const btn  = document.getElementById('write-feedback-btn');
      if (data.eligible) {
        btn.href          = `/feedback/create?productId=${currentProductId}`;
        btn.style.display = '';
      } else {
        btn.style.display = 'none';
      }
    } catch (_) {}
  }

  // Fetch all feedback for the product and render each card with responses
  async function loadFeedbackList() {
    const fbLoading = document.getElementById('feedback-loading');
    const fbError   = document.getElementById('feedback-error');
    const noFb      = document.getElementById('no-feedback');
    const fbList    = document.getElementById('feedback-list');

    fbLoading.style.display = 'block';
    fbError.style.display   = 'none';
    noFb.style.display      = 'none';
    fbList.innerHTML        = '';

    try {
      // GET /feedback/:productId/all  →  get_feedback_by_product()  [SQL function]
      const res  = await fetch(`/feedback/${currentProductId}/all`);
      const data = await res.json();

      fbLoading.style.display = 'none';

      if (!data.success) {
        fbError.textContent   = data.message || 'Failed to load feedback.';
        fbError.style.display = 'block';
        return;
      }

      if (!data.feedback || data.feedback.length === 0) {
        noFb.style.display = 'block';
        return;
      }

      for (const fb of data.feedback) {
        // Access control: isOwner determines Edit/Delete visibility and
        // whether the response form is shown (authors cannot respond to own feedback)
        const isOwner = currentUserId && Number(fb.member_id) === Number(currentUserId);
        fbList.appendChild(buildFeedbackCard(fb, isOwner));
      }

    } catch (_) {
      fbLoading.style.display = 'none';
      fbError.textContent     = 'Failed to load feedback.';
      fbError.style.display   = 'block';
    }
  }

  // Build a single feedback card with inline responses
  function buildFeedbackCard(fb, isOwner) {
    const card = document.createElement('div');
    card.className = 'card mb-3';
    card.id = `feedback-card-${fb.feedback_id}`;

    card.innerHTML = `
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <span class="fw-semibold me-2">${escapeHtml(fb.username || 'Member')}</span>
            <span>${renderStars(fb.rating)}</span>
            <small class="text-muted ms-2">${new Date(fb.created_at).toLocaleDateString()}</small>
          </div>
          ${isOwner ? `
            <div class="d-flex gap-2">
              <a href="/feedback/${fb.feedback_id}/edit?productId=${currentProductId}"
                 class="btn btn-outline-primary btn-sm">Edit</a>
              <button class="btn btn-outline-danger btn-sm"
                      onclick="deleteFeedback(${fb.feedback_id})">Delete</button>
            </div>` : ''}
        </div>

        <p class="mt-2 mb-2">
          ${fb.comment ? escapeHtml(fb.comment) : '<em class="text-muted">No comment.</em>'}
        </p>

        <!-- Responses — loaded async below -->
        <div id="responses-${fb.feedback_id}" class="ms-3 mt-2 border-start ps-3">
          <small class="text-muted">Loading responses…</small>
        </div>

        <!-- Response form — access control: only non-authors can respond -->
        ${!isOwner ? `
          <div class="mt-2">
            <div class="input-group input-group-sm">
              <input type="text" class="form-control"
                     id="response-input-${fb.feedback_id}"
                     placeholder="Write a response…" maxlength="500">
              <button class="btn btn-outline-secondary"
                      onclick="submitResponse(${fb.feedback_id})">Send</button>
            </div>
            <div id="response-error-${fb.feedback_id}"
                 class="text-danger mt-1" style="font-size:0.85rem;"></div>
          </div>` : ''}
      </div>`;

    // Kick off async response load — does not block card rendering
    loadResponses(fb.feedback_id);

    return card;
  }

  // ── Responses ─────────────────────────────────────────────────────────────

  // GET /feedback/:feedbackId/responses  →  get_response()  [SQL function]
  async function loadResponses(feedbackId) {
    const container = document.getElementById(`responses-${feedbackId}`);
    try {
      const res  = await fetch(`/feedback/${feedbackId}/responses`);
      const data = await res.json();

      if (!data.success || data.responses.length === 0) {
        container.innerHTML = '<small class="text-muted">No responses yet.</small>';
        return;
      }

      container.innerHTML = data.responses.map(r => {
        // Access control: only the response author sees the Delete button
        const isMine = currentUserId && Number(r.member_id) === Number(currentUserId);
        return `
          <div class="d-flex justify-content-between align-items-start mb-1"
               id="response-row-${r.response_id}">
            <div>
              <span class="fw-semibold me-1" style="font-size:0.9rem;">
                ${escapeHtml(r.username || 'Member')}:
              </span>
              <span style="font-size:0.9rem;">${escapeHtml(r.response_text)}</span>
              <small class="text-muted ms-1">
                ${new Date(r.created_at).toLocaleDateString()}
              </small>
            </div>
            ${isMine ? `
              <button class="btn btn-link btn-sm text-danger p-0 ms-2"
                      onclick="deleteResponse(${r.response_id})">Delete</button>` : ''}
          </div>`;
      }).join('');

    } catch (_) {
      container.innerHTML = '<small class="text-danger">Could not load responses.</small>';
    }
  }

  // POST /feedback/:feedbackId/responses  →  create_response()  [SQL procedure]
  // Access control enforced in procedure: cannot respond to own feedback
  async function submitResponse(feedbackId) {
    const input   = document.getElementById(`response-input-${feedbackId}`);
    const errorEl = document.getElementById(`response-error-${feedbackId}`);
    const text    = input.value.trim();

    errorEl.textContent = '';

    if (!text) {
      errorEl.textContent = 'Response cannot be empty.';
      return;
    }

    try {
      const res  = await fetch(`/feedback/${feedbackId}/responses`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ response_text: text })
      });
      const data = await res.json();

      if (data.success) {
        input.value = '';
        loadResponses(feedbackId);   // Refresh the responses block
      } else {
        errorEl.textContent = data.message || 'Failed to submit response.';
      }
    } catch (_) {
      errorEl.textContent = 'An error occurred.';
    }
  }

  // DELETE /feedback/responses/:id  →  delete_response()  [SQL procedure]
  // Access control enforced in procedure: only response owner can delete
  async function deleteResponse(responseId) {
    if (!confirm('Delete this response?')) return;
    try {
      const res  = await fetch(`/feedback/responses/${responseId}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) {
        const row = document.getElementById(`response-row-${responseId}`);
        if (row) row.remove();
      } else {
        alert(data.message || 'Failed to delete response.');
      }
    } catch (_) {
      alert('An error occurred.');
    }
  }

  // DELETE /feedback/:id  →  delete_feedback()  [SQL procedure]
  // Access control enforced in procedure: only feedback owner can delete
  async function deleteFeedback(feedbackId) {
    if (!confirm('Delete this feedback? All responses will also be removed.')) return;
    try {
      const res  = await fetch(`/feedback/${feedbackId}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) {
        const card = document.getElementById(`feedback-card-${feedbackId}`);
        if (card) card.remove();
        // Show empty state if no cards remain
        if (!document.querySelector('#feedback-list .card')) {
          document.getElementById('no-feedback').style.display = 'block';
        }
        // Re-check eligibility — deleting own feedback may re-enable Write Feedback
        checkWriteFeedbackEligibility();
      } else {
        alert(data.message || 'Failed to delete feedback.');
      }
    } catch (_) {
      alert('An error occurred.');
    }
  }

  // ── Utilities ─────────────────────────────────────────────────────────────
  function renderStars(rating) {
    let html = '';
    for (let i = 1; i <= 5; i++) {
      html += `<span class="${i <= rating ? 'text-warning' : 'text-muted'}"
                     style="font-size:1.1rem;">★</span>`;
    }
    return html;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  </script>
</body>
</html>
