<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Restaurant Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3" id="nav-username">Welcome</span>
        <a href="/orders/my-orders"     class="nav-link text-white me-2">My Orders</a>
        <a href="/feedback/my-feedback" class="nav-link text-white me-2">My Feedback</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4">

    <div class="mb-3 d-flex gap-2 flex-wrap">
      <a href="/member/products" class="btn btn-outline-secondary btn-sm">← Back to Menu</a>
      <a id="view-feedback-btn"  href="#" class="btn btn-outline-primary btn-sm">View Feedback</a>
      <a id="write-feedback-btn" href="#" class="btn btn-primary btn-sm" style="display:none;">Write Feedback</a>
    </div>

    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading…</span>
      </div>
    </div>

    <div id="error-message" class="alert alert-danger" style="display:none;">
      Failed to load product details.
    </div>

    <div id="product-detail" style="display:none;">

      <!-- Product Info Card -->
      <div class="card mb-4">
        <div class="card-body">
          <h4 class="card-title mb-3" id="detail-name"></h4>
          <table class="table table-striped align-middle">
            <tbody>
              <tr><th style="width:180px;">Category</th><td id="detail-category"></td></tr>
              <tr><th>Description</th><td id="detail-description"></td></tr>
              <tr><th>Price</th><td id="detail-price"></td></tr>
              <tr><th>Status</th><td id="detail-status"></td></tr>
              <tr><th>Added</th><td id="detail-created-at"></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Place Order Card -->
      <div class="card mb-4" id="order-card">
        <div class="card-body">
          <h5 class="card-title">Place an Order</h5>

          <div id="order-success" class="alert alert-success" style="display:none;"></div>
          <div id="order-error"   class="alert alert-danger"  style="display:none;"></div>

          <form id="order-form">
            <div class="row g-3">
              <div class="col-md-2">
                <label for="quantity" class="form-label">Quantity</label>
                <input type="number" class="form-control" id="quantity"
                       value="1" min="1" max="99" required>
              </div>
              <div class="col-md-7">
                <label for="delivery-address" class="form-label">Delivery Address</label>
                <input type="text" class="form-control" id="delivery-address"
                       placeholder="e.g. 123 Main Street, Singapore 123456" required>
              </div>
              <div class="col-md-3 d-flex align-items-end">
                <button type="submit" id="order-btn" class="btn btn-success w-100">
                  Order Now
                </button>
              </div>
            </div>
          </form>

        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  document.addEventListener('DOMContentLoaded', async () => {
    // Show username
    try {
      const r = await fetch('/api/auth/status');
      const d = await r.json();
      if (d.authenticated) {
        document.getElementById('nav-username').textContent = `Welcome, ${d.user.name}`;
      }
    } catch (_) {}

    fetchProductDetail();
  });

  async function fetchProductDetail() {
    const params    = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const loading   = document.getElementById('loading');
    const errEl     = document.getElementById('error-message');
    const detail    = document.getElementById('product-detail');

    if (!productId) {
      loading.style.display = 'none';
      errEl.style.display   = 'block';
      errEl.textContent     = 'No product specified.';
      return;
    }

    try {
      const res  = await fetch(`/products/${productId}`);
      const data = await res.json();
      loading.style.display = 'none';

      if (!data.success || !data.product) {
        errEl.style.display = 'block';
        return;
      }

      const p = data.product;
      document.title = `${p.name} - Restaurant`;
      document.getElementById('detail-name').textContent        = p.name;
      document.getElementById('detail-category').textContent    = p.category    || '—';
      document.getElementById('detail-description').textContent = p.description || '—';
      document.getElementById('detail-price').textContent       = `$${parseFloat(p.price).toFixed(2)}`;
      document.getElementById('detail-created-at').textContent  = new Date(p.created_at).toLocaleDateString();
      document.getElementById('detail-status').innerHTML = `
        <span class="badge ${p.is_available ? 'bg-success' : 'bg-secondary'}">
          ${p.is_available ? 'Available' : 'Unavailable'}
        </span>`;

      // Hide order form if product unavailable
      if (!p.is_available) {
        document.getElementById('order-card').style.display = 'none';
      }

      // Wire feedback link
      document.getElementById('view-feedback-btn').href = `/feedback/${productId}`;

      // Wire Write Feedback button — show only when eligible (completed order, not yet reviewed)
      try {
        const eligRes  = await fetch(`/feedback/${productId}/eligibility`);
        const eligData = await eligRes.json();
        const writeBtn = document.getElementById('write-feedback-btn');
        if (eligData.eligible) {
          writeBtn.href          = `/feedback/create?productId=${productId}`;
          writeBtn.style.display = '';
        }
      } catch (_) {}

      detail.style.display = 'block';

      // Wire order form
      document.getElementById('order-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const successEl = document.getElementById('order-success');
        const errorEl   = document.getElementById('order-error');
        const btn       = document.getElementById('order-btn');

        successEl.style.display = 'none';
        errorEl.style.display   = 'none';
        btn.disabled    = true;
        btn.textContent = 'Placing order…';

        try {
          const res  = await fetch('/orders', {
            method:  'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              product_id:       productId,
              quantity:         parseInt(document.getElementById('quantity').value),
              delivery_address: document.getElementById('delivery-address').value.trim()
            })
          });
          const data = await res.json();

          if (data.success) {
            successEl.innerHTML = `
              Order placed! Status: <strong>PACKING</strong>.
              <a href="/orders/my-orders" class="alert-link ms-2">View My Orders →</a>`;
            successEl.style.display = 'block';
            document.getElementById('order-form').reset();
          } else {
            errorEl.textContent   = data.message || 'Failed to place order.';
            errorEl.style.display = 'block';
          }
        } catch (_) {
          errorEl.textContent   = 'An error occurred.';
          errorEl.style.display = 'block';
        }

        btn.disabled    = false;
        btn.textContent = 'Order Now';
      });

    } catch (err) {
      console.error(err);
      loading.style.display = 'none';
      errEl.style.display   = 'block';
    }
  }
  </script>
</body>
</html>
