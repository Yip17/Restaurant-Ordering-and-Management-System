<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Restaurant Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">Restaurant Ordering System</a>
  </div>
</nav>

<main class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">

      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h4 class="mb-0">Member Registration</h4>
          <a href="/login" class="btn btn-outline-secondary btn-sm">Back to Login</a>
        </div>

        <div class="card-body">
          <div id="error-message"   class="alert alert-danger"  style="display:none;"></div>
          <div id="success-message" class="alert alert-success" style="display:none;"></div>

          <form id="registerForm" novalidate>

            <div class="mb-3">
              <label for="username" class="form-label">Username <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="username"
                     placeholder="e.g. johndoe" minlength="3" maxlength="50" required>
              <div class="invalid-feedback">Username must be at least 3 characters.</div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="first_name" class="form-label">First Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="first_name"
                       placeholder="John" maxlength="50" required>
                <div class="invalid-feedback">First name is required.</div>
              </div>
              <div class="col-md-6 mb-3">
                <label for="last_name" class="form-label">Last Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="last_name"
                       placeholder="Doe" maxlength="50" required>
                <div class="invalid-feedback">Last name is required.</div>
              </div>
            </div>

            <div class="mb-3">
              <label for="email" class="form-label">Email <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="email"
                     placeholder="john@example.com" required>
              <div class="invalid-feedback">Please enter a valid email address.</div>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="password"
                     placeholder="Minimum 8 characters" minlength="8" required>
              <div class="invalid-feedback">Password must be at least 8 characters.</div>
            </div>

            <div class="mb-4">
              <label for="confirm_password" class="form-label">Confirm Password <span class="text-danger">*</span></label>
              <input type="password" class="form-control" id="confirm_password"
                     placeholder="Re-enter your password" required>
              <div class="invalid-feedback">Passwords do not match.</div>
            </div>

            <button type="submit" id="submit-btn" class="btn btn-primary w-100">
              Create Account
            </button>

          </form>
        </div>
      </div>

    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();

  const errEl     = document.getElementById('error-message');
  const successEl = document.getElementById('success-message');
  const btn       = document.getElementById('submit-btn');

  errEl.style.display     = 'none';
  successEl.style.display = 'none';

  // --- Client-side validation ---
  const username  = document.getElementById('username').value.trim();
  const firstName = document.getElementById('first_name').value.trim();
  const lastName  = document.getElementById('last_name').value.trim();
  const email     = document.getElementById('email').value.trim();
  const password  = document.getElementById('password').value;
  const confirm   = document.getElementById('confirm_password').value;

  if (!username || username.length < 3) {
    showError('Username must be at least 3 characters.');
    return;
  }
  if (!firstName || !lastName) {
    showError('First name and last name are required.');
    return;
  }
  if (!email) {
    showError('Email is required.');
    return;
  }
  if (password.length < 8) {
    showError('Password must be at least 8 characters.');
    return;
  }
  if (password !== confirm) {
    showError('Passwords do not match.');
    document.getElementById('confirm_password').classList.add('is-invalid');
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Creating account…';

  try {
    const res  = await fetch('/register', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ username, first_name: firstName, last_name: lastName, email, password })
    });

    const result = await res.json();

    if (result.success) {
      successEl.textContent   = 'Registration successful! Redirecting…';
      successEl.style.display = 'block';
      setTimeout(() => { window.location.href = result.redirectUrl; }, 800);
    } else {
      showError(result.message || 'Registration failed. Please try again.');
      btn.disabled    = false;
      btn.textContent = 'Create Account';
    }
  } catch (_) {
    showError('An error occurred. Please try again.');
    btn.disabled    = false;
    btn.textContent = 'Create Account';
  }
});

function showError(msg) {
  const el = document.getElementById('error-message');
  el.textContent   = msg;
  el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
</script>

</body>
</html>
