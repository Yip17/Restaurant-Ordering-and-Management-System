<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Restaurant Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/">Restaurant Ordering System</a>
  </div>
</nav>

<main class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card">
        <div class="card-header">
          <h4 class="mb-0">Login</h4>
        </div>
        <div class="card-body">

          <div id="error-message" class="alert alert-danger" style="display:none;"></div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <!-- type="text" instead of type="email" — browser format check commented out -->
              <input type="text" class="form-control" id="email" name="email"
                     placeholder="your@email.com" required>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password"
                     placeholder="Password" required>
            </div>

            <div class="d-flex justify-content-between align-items-center">
              <button type="submit" class="btn btn-primary">Login</button>
              <a href="/register" class="btn btn-outline-secondary">Register</a>
            </div>
          </form>

          <!-- Test credentials hint -->
          <hr class="mt-4">
          <small class="text-muted">
            <strong>Admin:</strong> sally@example.com / Password123<br>
            <strong>User:</strong> teddy@example.com / Password123
          </small>

        </div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/queryCmds.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
