<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add to Cart - Restaurant Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3" id="nav-username">Welcome</span>
        <a href="/member/products"   class="nav-link text-white me-2">Menu</a>
        <a href="/cart/retrieve/all" class="nav-link text-white me-2">My Cart</a>
        <a href="/orders/my-orders"  class="nav-link text-white me-2">My Orders</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4">

    <div class="mb-3">
      <a href="/member/products" class="btn btn-outline-secondary btn-sm">← Back to Menu</a>
      <a href="/cart/retrieve/all" class="btn btn-outline-primary btn-sm ms-2">View My Cart →</a>
    </div>

    <div class="card" style="max-width:600px;">
      <div class="card-body">
        <h4 class="card-title mb-4">Add Item to Cart</h4>

        <div id="success-message" class="alert alert-success" style="display:none;"></div>
        <div id="error-message"   class="alert alert-danger"  style="display:none;"></div>

        <form id="add-to-cart-form">
          <div class="mb-3">
            <label for="product-select" class="form-label">Select Product</label>
            <select class="form-select" id="product-select" required>
              <option value="">-- Loading products... --</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="quantity" class="form-label">Quantity</label>
            <input type="number" class="form-control" id="quantity"
                   value="1" min="1" max="99" required style="max-width:120px;">
          </div>

          <button type="submit" id="add-btn" class="btn btn-success">
            Add to Cart
          </button>
        </form>

      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/queryCmds.js"></script>
  <script src="/js/cart-create.js"></script>
</body>
</html>
