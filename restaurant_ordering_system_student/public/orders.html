<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - Restaurant Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3" id="nav-username">Welcome</span>
        <a href="/member/products"       class="nav-link text-white me-2">Menu</a>
        <a href="/feedback/my-feedback"  class="nav-link text-white me-2">My Feedback</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">My Orders</h4>
      <a href="/member/products" class="btn btn-primary btn-sm">Browse Menu</a>
    </div>

    <div id="error-message" class="alert alert-danger" style="display:none;"></div>

    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading…</span>
      </div>
    </div>

    <div id="no-orders" class="alert alert-info" style="display:none;">
      You have no orders yet. <a href="/member/products">Browse the menu</a> to place one.
    </div>

    <div id="orders-list"></div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/queryCmds.js"></script>
  <script src="/js/orders.js"></script>
</body>
</html>
