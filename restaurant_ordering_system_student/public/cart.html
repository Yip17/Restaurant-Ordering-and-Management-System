<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart - Restaurant Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .cart-item-row { border-bottom: 1px solid #dee2e6; }
    .cart-item-row:last-child { border-bottom: none; }
    .qty-stepper { display:flex; align-items:center; gap:6px; }
    .qty-stepper button {
      width:30px; height:30px; padding:0;
      font-size:1rem; line-height:1;
      border-radius:50%;
    }
    .qty-display {
      min-width:34px; text-align:center;
      font-weight:600; font-size:.95rem;
    }
    .item-subtotal { font-weight:600; color:#198754; white-space:nowrap; }
    /* Make the summary column sticky on scroll */
    .summary-sticky { position:sticky; top:80px; }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3" id="nav-username">Welcome</span>
        <a href="/member/products"   class="nav-link text-white me-2">Menu</a>
        <a href="/orders/my-orders"  class="nav-link text-white me-2">My Orders</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h4 class="mb-0">🛒 My Cart</h4>
      <a href="/member/products" class="btn btn-outline-success btn-sm">+ Add More Items</a>
    </div>

    <!-- Loading spinner -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading…</span>
      </div>
    </div>

    <!-- Feedback banner -->
    <div id="action-error" class="alert alert-danger" style="display:none;"></div>

    <!-- Empty cart -->
    <div id="empty-cart" class="text-center py-5" style="display:none;">
      <p class="text-muted fs-5">Your cart is empty.</p>
      <a href="/member/products" class="btn btn-success">Browse Menu</a>
    </div>

    <!-- ── Two-column layout: items (left) | summary (right) ─────────── -->
    <div id="cart-content" style="display:none;">
      <div class="row g-4 align-items-start">

        <!-- ── LEFT: Cart items list ──────────────────────────────── -->
        <div class="col-lg-8">
          <div class="card">
            <div class="card-header fw-semibold">Items in Cart</div>
            <div class="card-body p-0" id="cart-items-list">
              <!-- rows injected by cart.js -->
            </div>
          </div>
        </div>

        <!-- ── RIGHT: Order summary + checkout ───────────────────── -->
        <div class="col-lg-4">
          <div class="card summary-sticky">
            <div class="card-header fw-semibold">Order Summary</div>
            <div class="card-body">
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Distinct Items</span>
                <span id="summary-item-count" class="fw-semibold">—</span>
              </div>
              <div class="d-flex justify-content-between mb-2">
                <span class="text-muted">Total Quantity</span>
                <span id="summary-total-qty" class="fw-semibold">—</span>
              </div>
              <hr class="my-2">
              <div class="d-flex justify-content-between mb-1">
                <span class="fw-bold fs-5">Subtotal</span>
                <span id="summary-subtotal" class="fw-bold fs-5 text-success">—</span>
              </div>
              <p class="text-muted mt-1 mb-3" style="font-size:.8rem;">
                Delivery fees and discounts are applied at checkout.
              </p>
              <a href="/checkout" class="btn btn-primary w-100">Proceed to Checkout →</a>
            </div>
          </div>
        </div>

      </div><!-- /row -->
    </div><!-- /#cart-content -->

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/queryCmds.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
