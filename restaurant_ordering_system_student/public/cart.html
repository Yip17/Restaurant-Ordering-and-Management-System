<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Cart - Restaurant Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3" id="nav-username">Welcome</span>
        <a href="/member/products"   class="nav-link text-white me-2">Menu</a>
        <a href="/cart/create"       class="nav-link text-white me-2">Add to Cart</a>
        <a href="/orders/my-orders"  class="nav-link text-white me-2">My Orders</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4">

    <div class="mb-3 d-flex gap-2 flex-wrap">
      <a href="/member/products" class="btn btn-outline-secondary btn-sm">← Back to Menu</a>
      <a href="/cart/create"     class="btn btn-success btn-sm">+ Add More Items</a>
    </div>

    <h4 class="mb-3">My Cart</h4>

    <!-- Loading spinner -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading…</span>
      </div>
    </div>

    <!-- Error display -->
    <div id="error-message" class="alert alert-danger" style="display:none;"></div>

    <!-- Empty cart message -->
    <div id="empty-cart" class="alert alert-info" style="display:none;">
      Your cart is empty.
      <a href="/cart/create" class="alert-link ms-2">Add some items →</a>
    </div>

    <!-- Cart content (shown when items exist) -->
    <div id="cart-content" style="display:none;">

      <!-- Cart Items Table -->
      <div class="card mb-3">
        <div class="card-body">
          <h5 class="card-title">Cart Items</h5>

          <!-- Global action error/success messages for update/delete -->
          <div id="action-success" class="alert alert-success" style="display:none;"></div>
          <div id="action-error"   class="alert alert-danger"  style="display:none;"></div>

          <div class="table-responsive">
            <table class="table table-striped align-middle">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Category</th>
                  <th>Unit Price</th>
                  <th style="width:140px;">Quantity</th>
                  <th>Subtotal</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="cart-table-body"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Cart Summary Card -->
      <div class="card mb-3" style="max-width:400px;">
        <div class="card-body">
          <h5 class="card-title">Cart Summary</h5>
          <table class="table table-sm mb-0">
            <tbody>
              <tr>
                <td>Number of Items</td>
                <td class="text-end fw-semibold" id="summary-item-count">—</td>
              </tr>
              <tr>
                <td>Total Quantity</td>
                <td class="text-end fw-semibold" id="summary-total-qty">—</td>
              </tr>
              <tr class="table-success">
                <td><strong>Subtotal</strong></td>
                <td class="text-end"><strong id="summary-subtotal">—</strong></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div><!-- /#cart-content -->

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/queryCmds.js"></script>
  <script src="/js/cart.js"></script>
</body>
</html>
