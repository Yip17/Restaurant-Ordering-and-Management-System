<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Feedback - Restaurant Ordering System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────────────────────── -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3" id="nav-username">Welcome</span>
        <a href="/member/products"  class="nav-link text-white me-2">Menu</a>
        <a href="/orders/my-orders" class="nav-link text-white me-2">My Orders</a>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <!-- ── Main Content ───────────────────────────────────────────────────── -->
  <main class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="mb-0">My Feedback</h4>
      <a href="/member/products" class="btn btn-outline-secondary btn-sm">← Back to Menu</a>
    </div>

    <!-- Global alert (success / error) -->
    <div id="global-alert" class="alert" style="display:none;" role="alert"></div>

    <!-- Loading spinner -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading…</span>
      </div>
    </div>

    <!-- Empty-state message -->
    <div id="no-feedback" class="alert alert-info" style="display:none;">
      You have not submitted any feedback yet.
      <a href="/member/products" class="alert-link ms-1">Browse the menu</a> to order and review products.
    </div>

    <!-- Feedback table -->
    <div id="table-container" style="display:none;">
      <div class="table-responsive">
        <table class="table table-striped align-middle">
          <thead class="table-dark">
            <tr>
              <th>#</th>
              <th>Product</th>
              <th>Rating</th>
              <th>Comment</th>
              <th>Submitted</th>
              <th>Last Edited</th>
              <th style="width:160px;">Actions</th>
            </tr>
          </thead>
          <tbody id="feedback-tbody"></tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- ── Edit Modal ─────────────────────────────────────────────────────── -->
  <!--
    Inline edit form rendered as a Bootstrap modal so the member can update
    rating and comment without leaving the page.  The stored procedure
    update_feedback enforces ownership and validation in SQL.
  -->
  <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editModalLabel">Edit Feedback</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <form id="edit-form" novalidate>
          <input type="hidden" id="edit-feedback-id">

          <div class="modal-body">

            <!-- Modal-level error -->
            <div id="modal-error" class="alert alert-danger" style="display:none;"></div>

            <div class="mb-3">
              <label for="edit-rating" class="form-label">
                Rating <span class="text-danger">*</span>
              </label>
              <select class="form-select" id="edit-rating" required>
                <option value="" disabled>Select a rating</option>
                <option value="1">1 ★ — Poor</option>
                <option value="2">2 ★ — Fair</option>
                <option value="3">3 ★ — Good</option>
                <option value="4">4 ★ — Very Good</option>
                <option value="5">5 ★ — Excellent</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="edit-comment" class="form-label">
                Comment <span class="text-danger">*</span>
              </label>
              <textarea class="form-control" id="edit-comment" rows="4"
                        placeholder="Share your experience…" required></textarea>
            </div>

          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
              Cancel
            </button>
            <button type="submit" id="edit-save-btn" class="btn btn-primary">
              Save Changes
            </button>
          </div>
        </form>

      </div>
    </div>
  </div>

  <!-- ── Scripts ────────────────────────────────────────────────────────── -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  /* ==========================================================================
     my-feedback.html  —  Member's own feedback management page
     Calls:
       GET  /feedback/my           → get_feedback(member_id)   [function]
       PUT  /feedback/:id          → update_feedback(...)       [procedure]
       DELETE /feedback/:id        → delete_feedback(...)       [procedure]
     All validation and access control are enforced in the stored procedures.
     This page only handles HTTP concerns: rendering, user input, error display.
     ========================================================================== */

  // Bootstrap modal instance (initialised after DOM ready)
  let editModal;

  document.addEventListener('DOMContentLoaded', async () => {
    editModal = new bootstrap.Modal(document.getElementById('editModal'));

    // Populate navbar username
    try {
      const r = await fetch('/api/auth/status');
      const d = await r.json();
      if (d.authenticated) {
        document.getElementById('nav-username').textContent = `Welcome, ${d.user.name}`;
      }
    } catch (_) {}

    await loadMyFeedback();

    // Edit form submit — calls PUT /feedback/:id (update_feedback procedure)
    document.getElementById('edit-form').addEventListener('submit', handleEditSubmit);
  });

  /* ── Load & render the member's feedback list ─────────────────────────── */

  async function loadMyFeedback() {
    const loading    = document.getElementById('loading');
    const noFeedback = document.getElementById('no-feedback');
    const tableWrap  = document.getElementById('table-container');
    const tbody      = document.getElementById('feedback-tbody');

    loading.style.display    = 'block';
    noFeedback.style.display = 'none';
    tableWrap.style.display  = 'none';
    tbody.innerHTML          = '';

    try {
      // GET /feedback/my  →  FeedbackController.index  →  get_feedback(memberId)
      const res  = await fetch('/feedback/my');
      const data = await res.json();

      loading.style.display = 'none';

      if (!data.success) {
        showGlobalAlert('danger', data.message || 'Failed to load feedback.');
        return;
      }

      if (!data.feedback || data.feedback.length === 0) {
        noFeedback.style.display = 'block';
        return;
      }

      // Render each row
      data.feedback.forEach((fb, idx) => {
        tbody.insertAdjacentHTML('beforeend', buildRow(fb, idx + 1));
      });

      tableWrap.style.display = 'block';

    } catch (_) {
      loading.style.display = 'none';
      showGlobalAlert('danger', 'An error occurred while loading your feedback.');
    }
  }

  /* ── Build a table row for one feedback entry ─────────────────────────── */

  function buildRow(fb, rowNum) {
    const stars     = renderStars(fb.rating);
    const submitted = new Date(fb.created_at).toLocaleDateString();
    const edited    = fb.updated_at
                        ? new Date(fb.updated_at).toLocaleDateString()
                        : '<span class="text-muted">—</span>';

    return `
      <tr id="row-${fb.feedback_id}">
        <td>${rowNum}</td>
        <td>
          <a href="/feedback/${escapeHtml(String(fb.product_id))}"
             class="text-decoration-none">
            ${escapeHtml(fb.product_name || '—')}
          </a>
        </td>
        <td>${stars}</td>
        <td style="max-width:300px; word-break:break-word;">${escapeHtml(fb.comment || '')}</td>
        <td>${submitted}</td>
        <td>${edited}</td>
        <td>
          <div class="d-flex gap-1 flex-wrap">
            <button class="btn btn-outline-primary btn-sm"
                    data-id="${fb.feedback_id}"
                    data-rating="${fb.rating}"
                    data-comment="${escapeHtml(fb.comment || '')}"
                    onclick="openEditModal(this)">
              Edit
            </button>
            <button class="btn btn-outline-danger btn-sm"
                    onclick="deleteFeedback(${fb.feedback_id})">
              Delete
            </button>
          </div>
        </td>
      </tr>`;
  }

  /* ── Open edit modal pre-populated with current values ────────────────── */

  function openEditModal(btn) {
    const feedbackId     = btn.dataset.id;
    const currentRating  = btn.dataset.rating;
    // dataset always returns the HTML-decoded string, so no unescaping needed
    const currentComment = btn.dataset.comment;

    document.getElementById('edit-feedback-id').value = feedbackId;
    document.getElementById('edit-rating').value      = currentRating;
    document.getElementById('edit-comment').value     = currentComment;
    document.getElementById('modal-error').style.display = 'none';
    document.getElementById('modal-error').textContent   = '';

    const saveBtn = document.getElementById('edit-save-btn');
    saveBtn.disabled    = false;
    saveBtn.textContent = 'Save Changes';

    editModal.show();
  }

  /* ── Handle edit form submission ──────────────────────────────────────── */
  /*
     Calls PUT /feedback/:id  →  FeedbackController.update
                              →  Feedback.update()
                              →  CALL update_feedback($1,$2,$3,$4)
     The stored procedure validates: ownership, rating range, non-blank comment.
     Any RAISE EXCEPTION is caught in Feedback.update() and re-thrown with
     { userFacing: true }, which the controller returns as a 400 JSON response.
  */
  async function handleEditSubmit(e) {
    e.preventDefault();

    const feedbackId = document.getElementById('edit-feedback-id').value;
    const rating     = parseInt(document.getElementById('edit-rating').value, 10);
    const comment    = document.getElementById('edit-comment').value.trim();
    const modalErr   = document.getElementById('modal-error');
    const saveBtn    = document.getElementById('edit-save-btn');

    // Client-side pre-check (procedure enforces this too)
    if (!rating) {
      modalErr.textContent   = 'Please select a rating.';
      modalErr.style.display = 'block';
      return;
    }
    if (!comment) {
      modalErr.textContent   = 'Comment cannot be empty.';
      modalErr.style.display = 'block';
      return;
    }

    saveBtn.disabled    = true;
    saveBtn.textContent = 'Saving…';
    modalErr.style.display = 'none';

    try {
      const res  = await fetch(`/feedback/${feedbackId}`, {
        method:  'PUT',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ rating, comment })
      });
      const data = await res.json();

      if (data.success) {
        editModal.hide();
        showGlobalAlert('success', 'Feedback updated successfully.');
        await loadMyFeedback();          // Reload the table
      } else {
        // Error message from stored procedure (e.g. INVALID_RATING, BLANK_COMMENT, ACCESS_DENIED)
        modalErr.textContent   = data.message || 'Failed to update feedback.';
        modalErr.style.display = 'block';
        saveBtn.disabled    = false;
        saveBtn.textContent = 'Save Changes';
      }
    } catch (_) {
      modalErr.textContent   = 'An error occurred.';
      modalErr.style.display = 'block';
      saveBtn.disabled    = false;
      saveBtn.textContent = 'Save Changes';
    }
  }

  /* ── Delete a feedback entry ──────────────────────────────────────────── */
  /*
     Calls DELETE /feedback/:id  →  FeedbackController.delete
                                 →  Feedback.delete()
                                 →  CALL delete_feedback($1,$2)
     The stored procedure validates: feedback exists, member owns it.
     ON DELETE CASCADE in the DB automatically removes all responses.
  */
  async function deleteFeedback(feedbackId) {
    if (!confirm('Delete this feedback?\nAll responses to it will also be removed.')) return;

    try {
      const res  = await fetch(`/feedback/${feedbackId}`, { method: 'DELETE' });
      const data = await res.json();

      if (data.success) {
        // Remove the row from the DOM immediately
        const row = document.getElementById(`row-${feedbackId}`);
        if (row) row.remove();

        // If no rows remain, switch to empty-state view
        const tbody = document.getElementById('feedback-tbody');
        if (!tbody.querySelector('tr')) {
          document.getElementById('table-container').style.display  = 'none';
          document.getElementById('no-feedback').style.display      = 'block';
        }

        showGlobalAlert('success', 'Feedback deleted successfully.');
      } else {
        // Error from stored procedure (ACCESS_DENIED, FEEDBACK_NOT_FOUND)
        showGlobalAlert('danger', data.message || 'Failed to delete feedback.');
      }
    } catch (_) {
      showGlobalAlert('danger', 'An error occurred.');
    }
  }

  /* ── Utilities ────────────────────────────────────────────────────────── */

  function renderStars(rating) {
    let html = '';
    for (let i = 1; i <= 5; i++) {
      html += `<span class="${i <= rating ? 'text-warning' : 'text-muted'}"
                     style="font-size:1rem;">★</span>`;
    }
    return `${html} <small class="text-muted">(${rating}/5)</small>`;
  }

  function showGlobalAlert(type, message) {
    const el = document.getElementById('global-alert');
    el.className        = `alert alert-${type} alert-dismissible fade show`;
    el.innerHTML        = `${escapeHtml(message)}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>`;
    el.style.display    = 'block';
    // Auto-dismiss success alerts after 4 seconds
    if (type === 'success') setTimeout(() => el.style.display = 'none', 4000);
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  </script>
</body>
</html>
